# Main Nginx config for the frontend container (Docker Compose and ECS).
# The server block is rendered at container start from
# templates/default.conf.template (the nginx image runs envsubst on it).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
}
