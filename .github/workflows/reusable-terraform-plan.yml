# Called by deploy-ec2.yml and deploy-ecs.yml. Produces a saved Terraform plan
# for one environment of one platform using the read-only plan role, and shows
# it in the run summary so approvers can review exactly what will be applied.
#
#   platform ec2 -> infra/terraform/environments/<environment>
#   platform ecs -> infra/terraform/environments/ecs-<environment>

name: Terraform plan (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: ec2 or ecs
        type: string
        required: true
      environment:
        type: string
        required: true
      version:
        description: Release (commit SHA) to deploy
        type: string
        required: true
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.4"
  TF_DIR: infra/terraform/environments/${{ inputs.platform == 'ecs' && 'ecs-' || '' }}${{ inputs.environment }}

jobs:
  plan:
    name: terraform plan (${{ inputs.platform }} ${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Check platform
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in ec2|ecs) ;; *) echo "::error::platform must be ec2 or ecs"; exit 1;; esac

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: ./.github/actions/setup-hashicorp
        with:
          tool: terraform
          version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false

      # -lock=false: the plan role is read-only. The apply job takes the lock,
      # and Terraform refuses to apply this plan if state changed meanwhile.
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock=false \
            -var "app_version=${{ inputs.version }}" -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          {
            echo "### Plan for ${{ inputs.platform }} ${{ inputs.environment }} (release ${{ inputs.version }})"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.platform }}-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          # Terraform refuses to apply a plan if the state changed since, so
          # keeping it a few days only allows a late prod approval.
          retention-days: 7
          overwrite: true

      # The apply job for prod now waits for a reviewer: tell them.
      - name: Summarise the plan for Slack
        id: summary
        if: inputs.environment == 'prod'
        run: |
          line=$(grep -m1 -E '^Plan: |No changes\.' plan.txt || echo "see the run")
          echo "line=${line}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (prod waiting for approval)
        if: inputs.environment == 'prod'
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ":hourglass_flowing_sand: *${{ inputs.platform == 'ecs' && 'ECS' || 'EC2' }} prod* is waiting for your approval. Release `${{ inputs.version }}` (by ${{ github.actor }}). ${{ steps.summary.outputs.line }} <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Review deployment>"
