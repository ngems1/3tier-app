# Called by deploy-ec2.yml and deploy-ecs.yml. Applies the saved plan for one
# environment of one platform with that environment's deploy role, waits for
# the rollout to finish, and runs the smoke tests.
#
# Automatic rollback: if the rollout or the smoke tests fail, the environment
# is redeployed with the previously recorded good release (same Terraform
# code, previous AMIs / images) and smoke-tested again. The job still fails,
# so the pipeline stops (prod is never planned after a failed dev), and the
# summary says whether the rollback worked.
#
# The job runs in the matching GitHub Environment (dev or prod) for both
# platforms, so the same protection rules (required reviewers on prod) and
# deploy roles apply to EC2 and ECS, and GitHub records the deployment history.

name: Terraform apply (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: ec2 or ecs
        type: string
        required: true
      environment:
        type: string
        required: true
      version:
        description: Release (commit SHA) being deployed
        type: string
        required: true
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.4"
  TF_DIR: infra/terraform/environments/${{ inputs.platform == 'ecs' && 'ecs-' || '' }}${{ inputs.environment }}
  # SSM parameter written by Terraform with the release currently deployed.
  VERSION_PARAMETER: /cloudbatch818-three-tier${{ inputs.platform == 'ecs' && '-ecs' || '' }}/${{ inputs.environment }}/deployed-version
  WORKFLOW_NAME: ${{ inputs.platform == 'ecs' && 'Deploy ECS' || 'Deploy EC2' }}

jobs:
  apply:
    name: terraform apply (${{ inputs.platform }} ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.app_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # A first deploy (RDS Multi-AZ) plus the rollout wait can exceed an hour.
          role-duration-seconds: 7200

      - uses: ./.github/actions/setup-hashicorp
        with:
          tool: terraform
          version: ${{ env.TF_VERSION }}

      - name: Record the currently deployed version (rollback target)
        id: previous
        run: |
          previous=$(aws ssm get-parameter --name "$VERSION_PARAMETER" \
            --query Parameter.Value --output text 2>/dev/null || echo "none")
          echo "version=${previous}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.platform }}-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: terraform apply (saved plan)
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" apply -input=false tfplan

      - name: Read outputs
        id: outputs
        run: echo "app_url=$(terraform -chdir="$TF_DIR" output -raw app_url)" >> "$GITHUB_OUTPUT"

      # Some RDS parameters (e.g. skip_name_resolve) only take effect after a
      # reboot. Reboot once when Terraform left the database "pending-reboot",
      # so the change is live before the smoke tests. Rare: only after a
      # static parameter changes (brief database downtime, ~1-2 minutes).
      - name: Apply pending database parameter changes
        run: |
          db_id=$(terraform -chdir="$TF_DIR" output -raw db_endpoint | cut -d. -f1)
          aws rds wait db-instance-available --db-instance-identifier "${db_id}"
          status=$(aws rds describe-db-instances --db-instance-identifier "${db_id}" \
            --query 'DBInstances[0].DBParameterGroups[0].ParameterApplyStatus' --output text)
          echo "Parameter group of ${db_id}: ${status}"
          if [ "${status}" = "pending-reboot" ]; then
            echo "Rebooting ${db_id} to apply the new parameters."
            aws rds reboot-db-instance --db-instance-identifier "${db_id}" >/dev/null
            sleep 30
            aws rds wait db-instance-available --db-instance-identifier "${db_id}"
            echo "- Database \`${db_id}\` rebooted to apply parameter changes." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Scripts run through bash so they work even if the executable bit was
      # lost (for example when the repository was copied on Windows).

      # EC2: rolling instance refresh of both Auto Scaling groups (the refresh
      # rolls back by itself if new instances fail their health checks).
      - name: Wait for rolling instance refresh (EC2)
        id: rollout_ec2
        if: inputs.platform == 'ec2'
        run: |
          bash deploy/ec2/wait-for-refresh.sh \
            "$(terraform -chdir="$TF_DIR" output -raw app_asg_name)" \
            "$(terraform -chdir="$TF_DIR" output -raw web_asg_name)"

      # ECS: rolling service deployment (the deployment circuit breaker rolls
      # back by itself if new tasks keep failing).
      - name: Wait for the service deployments (ECS)
        id: rollout_ecs
        if: inputs.platform == 'ecs'
        run: bash deploy/ecs/verify-deployment.sh "$TF_DIR"

      - name: Smoke tests
        id: smoke
        run: bash tests/smoke/smoke_test.sh "${{ steps.outputs.outputs.app_url }}" "${{ inputs.version }}"

      # Only now is the release known to be good: record it as the deployed
      # version (the rollback target for the next deploy).
      - name: Record the deployed version
        run: |
          aws ssm put-parameter --name "$VERSION_PARAMETER" --type String --overwrite \
            --value "${{ inputs.version }}" >/dev/null
          echo "Recorded ${{ inputs.version }} in $VERSION_PARAMETER"

      # The new release was applied but is not working (rollout or smoke tests
      # failed): put the last known-good release back. Skipped on a first
      # deployment (nothing to go back to), when redeploying the same release,
      # and when terraform apply itself failed (the stack may be half-changed;
      # that needs a person to look at the plan).
      - name: Automatic rollback to the previous release
        id: rollback
        if: >-
          failure() &&
          (steps.rollout_ec2.outcome == 'failure' || steps.rollout_ecs.outcome == 'failure' ||
            steps.smoke.outcome == 'failure') &&
          steps.previous.outputs.version != 'none' &&
          steps.previous.outputs.version != inputs.version
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
          PLATFORM: ${{ inputs.platform }}
          APP_URL: ${{ steps.outputs.outputs.app_url }}
        run: |
          echo "::warning::Release ${{ inputs.version }} failed on ${PLATFORM} ${{ inputs.environment }}; rolling back to ${PREVIOUS}."
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve -var "app_version=${PREVIOUS}"
          if [ "${PLATFORM}" = "ec2" ]; then
            bash deploy/ec2/wait-for-refresh.sh \
              "$(terraform -chdir="$TF_DIR" output -raw app_asg_name)" \
              "$(terraform -chdir="$TF_DIR" output -raw web_asg_name)"
          else
            bash deploy/ecs/verify-deployment.sh "$TF_DIR"
          fi
          bash tests/smoke/smoke_test.sh "${APP_URL}" "${PREVIOUS}"

      - name: Deployment summary
        if: always()
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
          STATUS: ${{ job.status }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "### ${{ inputs.platform }} ${{ inputs.environment }}: ${STATUS}"
            echo "- Release: \`${{ inputs.version }}\`"
            echo "- Previous release: \`${PREVIOUS}\`"
            echo "- URL: ${{ steps.outputs.outputs.app_url }}"
            case "${ROLLBACK}" in
              success)
                echo ""
                echo "**Automatically rolled back** to \`${PREVIOUS}\`: it is running again and passed the smoke tests. Fix the problem in a new pull request." ;;
              failure)
                echo ""
                echo "**Automatic rollback to \`${PREVIOUS}\` failed.** Check the rollback step's log. Manual rollback: Actions > ${WORKFLOW_NAME} > Run workflow with environment \`${{ inputs.environment }}\` and version \`${PREVIOUS}\`." ;;
              *)
                if [ "${STATUS}" != "success" ] && [ -n "${PREVIOUS}" ] && [ "${PREVIOUS}" != "none" ]; then
                  echo ""
                  echo "**Roll back:** Actions > ${WORKFLOW_NAME} > Run workflow with environment \`${{ inputs.environment }}\` and version \`${PREVIOUS}\`."
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose the Slack message
        id: slack
        if: always()
        env:
          STATUS: ${{ job.status }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.platform == 'ecs' && 'ECS' || 'EC2' }} ${{ inputs.environment }}
          APP_URL: ${{ steps.outputs.outputs.app_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${STATUS}" = "success" ]; then
            text=":white_check_mark: *${TARGET}* deployed \`${VERSION::7}\` and passed the smoke tests. <${APP_URL}|Open the app> · <${RUN_URL}|Run>"
          elif [ "${ROLLBACK}" = "success" ]; then
            text=":rotating_light: *${TARGET}*: release \`${VERSION::7}\` failed and was *automatically rolled back* to \`${PREVIOUS::7}\` (healthy again). Fix it in a new change. <${RUN_URL}|Details>"
          elif [ "${ROLLBACK}" = "failure" ]; then
            text=":x: *${TARGET}*: release \`${VERSION::7}\` failed *and the automatic rollback to \`${PREVIOUS::7}\` failed too*. Action needed. <${RUN_URL}|Details>"
          elif [ "${STATUS}" = "cancelled" ]; then
            text=":warning: *${TARGET}*: deployment of \`${VERSION::7}\` was cancelled. <${RUN_URL}|Details>"
          else
            text=":x: *${TARGET}*: deployment of \`${VERSION::7}\` failed. <${RUN_URL}|Details>"
          fi
          {
            echo "text<<SLACK_EOF"
            echo "${text}"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ${{ steps.slack.outputs.text }}
