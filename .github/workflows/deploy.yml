# The one workflow a push to main starts, so every push shows up as a single
# "Deploy" run instead of one Deploy EC2 and one Deploy ECS run.
#
#   Deploy target -> CI (once) -> EC2 pipeline (deploy-ec2.yml)
#                              -> ECS pipeline (deploy-ecs.yml)
#
# The GitHub variable DEPLOY_TARGET picks which pipelines run:
#   ec2 (default) -> EC2 only; ecs -> ECS only; both -> both, side by side.
#
# Manual deployments and rollbacks don't go through here: use
# Actions > Deploy EC2 (or Deploy ECS) > Run workflow.

name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only changes don't deploy. A push that also touches any
    # other file still deploys as usual.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  target:
    name: Deploy target
    runs-on: ubuntu-latest
    outputs:
      ec2: ${{ steps.check.outputs.ec2 }}
      ecs: ${{ steps.check.outputs.ecs }}
    steps:
      - id: check
        env:
          TARGET: ${{ vars.DEPLOY_TARGET || 'ec2' }}
        run: |
          case "$TARGET" in
            ec2)  ec2=true;  ecs=false ;;
            ecs)  ec2=false; ecs=true ;;
            both) ec2=true;  ecs=true ;;
            *) echo "::error::DEPLOY_TARGET must be ec2, ecs or both (it is '$TARGET')"; exit 1 ;;
          esac
          {
            echo "ec2=${ec2}"
            echo "ecs=${ecs}"
          } >> "$GITHUB_OUTPUT"
          echo "DEPLOY_TARGET is \`$TARGET\`: EC2 ${ec2}, ECS ${ecs}." >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: [target]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  ec2:
    name: EC2
    needs: [target, ci]
    if: needs.target.outputs.ec2 == 'true'
    uses: ./.github/workflows/deploy-ec2.yml
    secrets: inherit
    with:
      ci_passed: true
    # The called workflow's jobs can't have more permissions than this.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  ecs:
    name: ECS
    needs: [target, ci]
    if: needs.target.outputs.ecs == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    secrets: inherit
    with:
      ci_passed: true
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  # Failures inside the EC2 / ECS pipelines are posted by those pipelines.
  # This covers the two jobs that run before them.
  notify-failure:
    name: Notify Slack of a pipeline failure
    needs: [target, ci]
    if: always() && (needs.target.result == 'failure' || needs.ci.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ":x: *Deploy* failed before deploying (stage: ${{ needs.target.result == 'failure' && 'deploy target' || 'ci' }}). Commit `${{ github.sha }}` by ${{ github.actor }}. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Details>"
