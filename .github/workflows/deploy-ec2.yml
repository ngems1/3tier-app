# Release and deployment for the EC2 project (Project 1).
#
# Pushes to main don't start this workflow directly: deploy.yml runs CI once
# and calls this workflow when the GitHub variable DEPLOY_TARGET is ec2 (the
# default) or both, so each push shows up as a single "Deploy" run.
# A manual run always deploys to EC2, whatever DEPLOY_TARGET says.
#
# Push to main (through deploy.yml):
#   CI -> build release (artifacts + Packer AMIs tagged with the commit SHA)
#      -> plan dev -> apply dev -> smoke test
#      -> plan prod -> [GitHub Environment approval] -> apply prod -> smoke test
#
# Manual run (Actions > Deploy EC2 > Run workflow):
#   * environment + no version : build the selected ref and deploy it there
#   * environment + version    : deploy an existing release (rollback/redeploy);
#                                nothing is rebuilt, the release's AMIs are reused
#
# Only the AMIs are built here. Container images are built by deploy-ecs.yml
# when ECS is deployed, so an EC2 deployment never waits for them.
#
# AWS access uses GitHub OIDC with separate roles per stage (see
# infra/terraform/bootstrap): read-only for plans, build for Packer, and one
# deploy role per GitHub Environment. No AWS keys are stored in GitHub.

name: Deploy EC2

on:
  # Called by deploy.yml for pushes to main.
  workflow_call:
    inputs:
      ci_passed:
        description: CI already passed in the calling workflow, so don't run it again
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        required: true
        default: dev
      version:
        description: Existing release (commit SHA) to deploy or roll back to. Leave empty to build the selected ref.
        type: string
        required: false
        default: ""
      allow_destructive:
        description: Allow deleting or replacing the database, load balancers or KMS key (destroy guard override)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One deployment at a time; never cancel a running apply.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  PACKER_VERSION: "1.16.1"
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  VERSION: ${{ inputs.version || github.sha }}

jobs:
  ci:
    name: CI
    if: inputs.version == '' && inputs.ci_passed != true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  release:
    name: Build release ${{ github.sha }}
    needs: [ci]
    if: >-
      !cancelled() && inputs.version == '' &&
      (needs.ci.result == 'success' ||
        (needs.ci.result == 'skipped' && inputs.ci_passed == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package versioned artifacts
        run: |
          mkdir -p dist
          tar -czf "dist/backend-${VERSION}.tar.gz" -C app/backend app requirements.txt
          tar -czf "dist/frontend-${VERSION}.tar.gz" -C app/frontend/build .
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}
          path: dist/
          retention-days: 90

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish artifacts to S3 (immutable, per version)
        run: aws s3 cp dist/ "s3://${{ vars.ARTIFACT_BUCKET }}/releases/${VERSION}/" --recursive

      - uses: ./.github/actions/setup-hashicorp
        with:
          tool: packer
          version: ${{ env.PACKER_VERSION }}

      - name: Bake AMIs (skipped if this version already exists)
        run: |
          count=$(aws ec2 describe-images --owners self \
            --filters "Name=tag:Project,Values=cloudbatch818-three-tier" "Name=tag:Version,Values=${VERSION}" "Name=state,Values=available" \
            --query 'length(Images)' --output text)
          if [ "${count}" -ge 2 ]; then
            echo "AMIs for ${VERSION} already exist; nothing to bake."
            exit 0
          fi
          packer init deploy/ec2/packer
          packer build -color=false -var "app_version=${VERSION}" -var "aws_region=${AWS_REGION}" deploy/ec2/packer

      - name: Summary
        run: |
          {
            echo "### Release ${VERSION}"
            echo "- Artifacts: \`s3://${{ vars.ARTIFACT_BUCKET }}/releases/${VERSION}/\`"
            echo "- AMIs tagged \`Version=${VERSION}\` (web + app)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # dev
  # ---------------------------------------------------------------------------

  plan-dev:
    name: Plan dev
    needs: [release]
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.environment == 'dev') &&
      (needs.release.result == 'success' ||
        (needs.release.result == 'skipped' && inputs.version != ''))
    uses: ./.github/workflows/reusable-terraform-plan.yml
    secrets: inherit
    with:
      platform: ec2
      environment: dev
      version: ${{ inputs.version || github.sha }}
      allow_destructive: ${{ inputs.allow_destructive == true }}
    permissions:
      contents: read
      id-token: write

  apply-dev:
    name: Apply dev
    needs: [plan-dev]
    # Explicit condition: jobs further up (CI, build) are skipped on rollbacks
    # and manual prod runs, which would otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan-dev.result == 'success' }}
    uses: ./.github/workflows/reusable-terraform-apply.yml
    secrets: inherit
    with:
      platform: ec2
      environment: dev
      version: ${{ inputs.version || github.sha }}
    permissions:
      contents: read
      id-token: write

  # ---------------------------------------------------------------------------
  # prod (promotion requires approval on the "prod" GitHub Environment)
  # ---------------------------------------------------------------------------

  plan-prod:
    name: Plan prod
    needs: [release, apply-dev]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.apply-dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' &&
          (needs.release.result == 'success' ||
            (needs.release.result == 'skipped' && inputs.version != '')))
      )
    uses: ./.github/workflows/reusable-terraform-plan.yml
    secrets: inherit
    with:
      platform: ec2
      environment: prod
      version: ${{ inputs.version || github.sha }}
      allow_destructive: ${{ inputs.allow_destructive == true }}
    permissions:
      contents: read
      id-token: write

  apply-prod:
    name: Apply prod
    needs: [plan-prod]
    # Explicit condition: jobs further up (CI, build) are skipped on rollbacks
    # and manual prod runs, which would otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan-prod.result == 'success' }}
    uses: ./.github/workflows/reusable-terraform-apply.yml
    secrets: inherit
    with:
      platform: ec2
      environment: prod
      version: ${{ inputs.version || github.sha }}
    permissions:
      contents: read
      id-token: write

  # Deploy results (success, failure, automatic rollback) are posted by the
  # apply jobs. This covers failures earlier on: CI, AMI build, plans.
  notify-failure:
    name: Notify Slack of a pipeline failure
    needs: [ci, release, plan-dev, plan-prod]
    if: >-
      always() && (
      needs.ci.result == 'failure' ||
      needs.release.result == 'failure' ||
      needs.plan-dev.result == 'failure' ||
      needs.plan-prod.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Which stage failed
        id: failed
        env:
          RESULT_CI: ${{ needs.ci.result }}
          RESULT_RELEASE: ${{ needs.release.result }}
          RESULT_PLAN_DEV: ${{ needs.plan-dev.result }}
          RESULT_PLAN_PROD: ${{ needs.plan-prod.result }}
        run: |
          failed=""
          for pair in "ci=${RESULT_CI}" "release=${RESULT_RELEASE}" "plan-dev=${RESULT_PLAN_DEV}" "plan-prod=${RESULT_PLAN_PROD}"; do
            [ "${pair#*=}" = "failure" ] && failed="${failed:+$failed, }${pair%%=*}"
          done
          echo "stages=${failed}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ":x: *Deploy EC2* failed before deploying (stage: ${{ steps.failed.outputs.stages }}). Commit `${{ github.sha }}` by ${{ github.actor }}. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Details>"
