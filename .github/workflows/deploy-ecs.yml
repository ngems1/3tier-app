# Release and deployment for the ECS project (Project 2): the same application
# as EC2, running as containers on Amazon ECS (Fargate).
#
# Pushes to main don't start this workflow directly: deploy.yml runs CI once
# and calls this workflow when the GitHub variable DEPLOY_TARGET is ecs or
# both, so each push shows up as a single "Deploy" run.
# A manual run always deploys to ECS, whatever DEPLOY_TARGET says.
#
# Push to main (through deploy.yml, DEPLOY_TARGET = ecs or both):
#   CI -> build, push and scan container images in ECR (tagged with the SHA)
#      -> plan ecs-dev -> apply ecs-dev -> wait for the rollout -> smoke test
#      -> plan ecs-prod -> [GitHub Environment approval] -> apply -> smoke test
#
# Manual run (Actions > Deploy ECS > Run workflow):
#   * environment + no version : build the selected ref and deploy it there
#   * environment + version    : deploy an existing release (rollback/redeploy);
#                                its images are reused if they exist in ECR, or
#                                built from that commit if it was never on ECS
#
# Uses the same GitHub Environments (dev, prod), deploy roles and approvals as
# the EC2 workflow. Each platform has its own Terraform state, VPC, load
# balancer and database, so deploying one never touches the other.

name: Deploy ECS

on:
  # Called by deploy.yml for pushes to main.
  workflow_call:
    inputs:
      ci_passed:
        description: CI already passed in the calling workflow, so don't run it again
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        required: true
        default: dev
      version:
        description: Existing release (commit SHA) to deploy or roll back to. Leave empty to build the selected ref.
        type: string
        required: false
        default: ""
      allow_destructive:
        description: Allow deleting or replacing the database, load balancers or KMS key (destroy guard override)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One deployment at a time; never cancel a running apply.
concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: inputs.version == '' && inputs.ci_passed != true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  # Also runs for a manual deploy/rollback of an existing version: images that
  # already exist in ECR are reused (nothing rebuilt), and a commit that was
  # only ever deployed to EC2 gets its images built from that commit.
  images:
    name: Container images
    needs: [ci]
    if: >-
      !cancelled() &&
      (needs.ci.result == 'success' ||
        (needs.ci.result == 'skipped' && (inputs.version != '' || inputs.ci_passed == true)))
    uses: ./.github/workflows/reusable-images.yml
    with:
      version: ${{ inputs.version || github.sha }}
    permissions:
      contents: read
      id-token: write

  # ---------------------------------------------------------------------------
  # dev
  # ---------------------------------------------------------------------------

  plan-dev:
    name: Plan ecs-dev
    needs: [images]
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.environment == 'dev') &&
      (needs.images.result == 'success' ||
        (needs.images.result == 'skipped' && inputs.version != ''))
    uses: ./.github/workflows/reusable-terraform-plan.yml
    secrets: inherit
    with:
      platform: ecs
      environment: dev
      version: ${{ inputs.version || github.sha }}
      allow_destructive: ${{ inputs.allow_destructive == true }}
    permissions:
      contents: read
      id-token: write

  apply-dev:
    name: Apply ecs-dev
    needs: [plan-dev]
    # Explicit condition: jobs further up (CI, build) are skipped on rollbacks
    # and manual prod runs, which would otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan-dev.result == 'success' }}
    uses: ./.github/workflows/reusable-terraform-apply.yml
    secrets: inherit
    with:
      platform: ecs
      environment: dev
      version: ${{ inputs.version || github.sha }}
    permissions:
      contents: read
      id-token: write

  # ---------------------------------------------------------------------------
  # prod (promotion requires approval on the "prod" GitHub Environment)
  # ---------------------------------------------------------------------------

  plan-prod:
    name: Plan ecs-prod
    needs: [images, apply-dev]
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.apply-dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' &&
          (needs.images.result == 'success' ||
            (needs.images.result == 'skipped' && inputs.version != '')))
      )
    uses: ./.github/workflows/reusable-terraform-plan.yml
    secrets: inherit
    with:
      platform: ecs
      environment: prod
      version: ${{ inputs.version || github.sha }}
      allow_destructive: ${{ inputs.allow_destructive == true }}
    permissions:
      contents: read
      id-token: write

  apply-prod:
    name: Apply ecs-prod
    needs: [plan-prod]
    # Explicit condition: jobs further up (CI, build) are skipped on rollbacks
    # and manual prod runs, which would otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan-prod.result == 'success' }}
    uses: ./.github/workflows/reusable-terraform-apply.yml
    secrets: inherit
    with:
      platform: ecs
      environment: prod
      version: ${{ inputs.version || github.sha }}
    permissions:
      contents: read
      id-token: write

  # Deploy results (success, failure, automatic rollback) are posted by the
  # apply jobs. This covers failures earlier on: CI, build, images, plans.
  notify-failure:
    name: Notify Slack of a pipeline failure
    needs: [ci, images, plan-dev, plan-prod]
    if: >-
      always() && (
      needs.ci.result == 'failure' ||
      needs.images.result == 'failure' ||
      needs.plan-dev.result == 'failure' ||
      needs.plan-prod.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Which stage failed
        id: failed
        env:
          RESULT_CI: ${{ needs.ci.result }}
          RESULT_IMAGES: ${{ needs.images.result }}
          RESULT_PLAN_DEV: ${{ needs.plan-dev.result }}
          RESULT_PLAN_PROD: ${{ needs.plan-prod.result }}
        run: |
          failed=""
          for pair in "ci=${RESULT_CI}" "images=${RESULT_IMAGES}" "plan-dev=${RESULT_PLAN_DEV}" "plan-prod=${RESULT_PLAN_PROD}"; do
            [ "${pair#*=}" = "failure" ] && failed="${failed:+$failed, }${pair%%=*}"
          done
          echo "stages=${failed}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ":x: *Deploy ECS* failed before deploying (stage: ${{ steps.failed.outputs.stages }}). Commit `${{ github.sha }}` by ${{ github.actor }}. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Details>"
