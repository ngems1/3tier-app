# Called by deploy-ec2.yml and deploy-ecs.yml. Builds the frontend and backend
# container images for one commit, pushes them to ECR tagged with the commit
# SHA, and blocks the release if ECR's scan finds CRITICAL vulnerabilities.
# Tags are immutable: a SHA that was already pushed is reused, never rebuilt,
# so EC2 and ECS deployments of the same commit always use identical images.

name: Container images (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Commit SHA to build and tag
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  VERSION: ${{ inputs.version }}

jobs:
  image:
    name: Image ${{ matrix.image }} -> ECR
    runs-on: ubuntu-latest
    # When both deploy workflows run for the same commit, the second one waits
    # and then finds the image already pushed.
    concurrency:
      group: image-${{ matrix.image }}-${{ inputs.version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend]
    env:
      REPOSITORY: cloudbatch818-three-tier-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ env.REPOSITORY }}:${{ env.VERSION }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${VERSION}" >/dev/null 2>&1; then
            echo "${REPOSITORY}:${VERSION} already exists; skipping build."
            exit 0
          fi
          image="${REGISTRY}/${REPOSITORY}:${VERSION}"
          docker build --build-arg "APP_VERSION=${VERSION}" -t "${image}" "app/${{ matrix.image }}"
          docker push "${image}"

      # ECR scans every pushed image: block the release on CRITICAL findings
      # and report HIGH ones in the run summary. Right after a push the scan
      # may not exist yet (or the registry doesn't scan on push), so poll, and
      # start a scan ourselves if none shows up. Works with basic scanning and
      # with enhanced scanning (Amazon Inspector).
      - name: ECR scan gate
        run: |
          args=(--repository-name "${REPOSITORY}" --image-id "imageTag=${VERSION}")
          started=false
          done=false
          for attempt in $(seq 1 40); do
            if out=$(aws ecr describe-image-scan-findings "${args[@]}" --output json 2>scan-error.txt); then
              status=$(jq -r '.imageScanStatus.status' <<<"${out}")
              case "${status}" in
                COMPLETE|ACTIVE)
                  done=true
                  break
                  ;;
                FAILED|UNSUPPORTED_IMAGE|FINDINGS_UNAVAILABLE|SCAN_ELIGIBILITY_EXPIRED)
                  echo "::error::ECR scan of ${REPOSITORY}:${VERSION} ended with status ${status}: $(jq -r '.imageScanStatus.description // ""' <<<"${out}")"
                  exit 1
                  ;;
                *)
                  echo "Scan status: ${status}. Waiting (attempt ${attempt}/40)."
                  ;;
              esac
            elif grep -q ScanNotFoundException scan-error.txt; then
              echo "No scan for ${REPOSITORY}:${VERSION} yet (attempt ${attempt}/40)."
              if [ "${started}" = false ] && [ "${attempt}" -ge 3 ]; then
                if aws ecr start-image-scan "${args[@]}" >/dev/null 2>scan-start-error.txt; then
                  echo "Started a scan."
                else
                  echo "Could not start a scan (still waiting for ECR's own scan):"
                  cat scan-start-error.txt
                fi
                started=true
              fi
            else
              cat scan-error.txt
              exit 1
            fi
            sleep 15
          done
          if [ "${done}" != true ]; then
            echo "::error::No ECR scan result for ${REPOSITORY}:${VERSION} after 10 minutes. Check that scanning is enabled in ECR (Private registry -> Scanning) and that the build role may call ecr:StartImageScan (re-run Bootstrap with apply)."
            exit 1
          fi

          # Basic scanning reports severity counts; enhanced scanning lists
          # each finding, so count those if the totals are missing.
          counts=$(jq '.imageScanFindings.findingSeverityCounts
            // ((.imageScanFindings.enhancedFindings // []) | map(.severity) | group_by(.) | map({(.[0]): length}) | add)
            // {}' <<<"${out}")
          critical=$(jq -r '.CRITICAL // 0' <<<"${counts}")
          high=$(jq -r '.HIGH // 0' <<<"${counts}")
          {
            echo "### ${REPOSITORY}:${VERSION}"
            echo "- ECR scan: CRITICAL=${critical}, HIGH=${high}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${critical}" -gt 0 ]; then
            echo "::error::${REPOSITORY}:${VERSION} has ${critical} CRITICAL vulnerabilities"
            exit 1
          fi
